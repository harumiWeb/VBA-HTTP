version: "3"

tasks:
  default:
    desc: Run the pre-commit quality gates
    cmds:
      - task: check

  lint:
    desc: Lint VBA source with xlflow
    cmds:
      - xlflow lint --json

  analyze:
    desc: Analyze VBA runtime risks with xlflow
    cmds:
      - xlflow analyze --json

  format:
    desc: Check VBA source formatting with xlflow
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Check-Format.ps1

  class-source:check:
    desc: Verify class exports are clean-importable by the VBIDE
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Validate-ClassSource.ps1

  class-source:normalize:
    desc: Normalize class exports to the VBIDE-required UTF-8 CRLF form
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Normalize-ClassSource.ps1

  check:
    desc: Run all pre-commit quality gates
    cmds:
      - task: lint
      - task: analyze
      - task: format
      - task: class-source:check

  test:
    desc: Run the complete xlflow test suite
    cmds:
      - xlflow test --isolation module --json

  test:integration:
    desc: Run WinHTTP integration tests against the deterministic loopback server
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Run-IntegrationTests.ps1

  test:download-stress:
    desc: Run the 1 GiB constant-memory download stress and hash verification
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Run-DownloadStressTests.ps1

  test:upload-stress:
    desc: Run the 1 GiB constant-memory upload and server hash verification
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Run-UploadStressTests.ps1

  test:resource-stress:
    desc: Run the Phase 9 10,000-request resource and handle stability gate
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Run-ResourceStressTests.ps1
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Validate-ResourceStressResult.ps1

  test:cancellation-stress:
    desc: Run repeated COM/native cancellation and timeout cleanup scenarios
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Run-CancellationStressTests.ps1
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Validate-CancellationStressResult.ps1

  testserver:test:
    desc: Run deterministic local HTTP server tests
    cmds:
      - task: testserver:unit
      - task: testserver:smoke

  testserver:unit:
    desc: Run local HTTP server unit tests and static checks
    dir: tools/testserver
    cmds:
      - go test -timeout 30s ./...
      - go vet ./...

  testserver:smoke:
    desc: Verify test server readiness, reset, and graceful shutdown
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Test-TestServerLifecycle.ps1

  test:release-checksum:
    desc: Verify deterministic release artifact checksum generation and validation
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Test-ReleaseChecksums.ps1

  test:release-security:
    desc: Verify release manifest security validation and fail-closed tamper cases
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Test-ReleaseSecurity.ps1

  test:security-risks:
    desc: Verify the current release risk register has no blocker and consistent deferred issues
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Test-SecurityRiskRegister.ps1
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Validate-SecurityRiskRegister.ps1

  test:docs:
    desc: Verify public API, contributor, distribution, and release checklist documentation contracts
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Test-DocumentationContract.ps1

  test:xlam:
    desc: Verify the tracked XLAM base identity and independent dry-run build plan
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Test-XlamDistribution.ps1

  test:clean-checkout:
    desc: Verify source gates and both build plans from a fresh git archive
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Test-CleanCheckout.ps1

  test:office-bitness:
    desc: Run the host-specific Office bitness compile, test, and consumer smoke evidence
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Run-OfficeBitnessValidation.ps1

  test:protocol-host-schema:
    desc: Verify fail-closed negotiated protocol host evidence schema and tamper cases
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Test-ProtocolHostEvidence.ps1

  protocol:host:
    desc: Run opt-in required HTTP/2 or HTTP/3 host evidence from environment variables
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Run-ProtocolHostValidation.ps1

  testserver:run:
    desc: Start the local HTTP server on an OS-selected port
    dir: tools/testserver
    cmds:
      - go run . -listen 127.0.0.1:0

  benchmark:raw:
    desc: Run the Raw WinHttpRequest loopback baseline
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Run-RawBenchmark.ps1

  benchmark:vba-http:
    desc: Measure the buffered VBA-HTTP client on the loopback baseline
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Run-RawBenchmark.ps1 -Implementation VBA-HTTP -OutputPath benchmarks/results/vba-http-buffered.json

  benchmark:phase2:
    desc: Compare buffered VBA-HTTP with Raw WinHttpRequest under matched conditions
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Run-RawBenchmark.ps1 -Implementation Raw -OutputPath benchmarks/results/phase2-raw-winhttp.json
      - task: benchmark:vba-http
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Compare-Phase2Benchmark.ps1

  benchmark:phase3:
    desc: Measure bounded concurrency against sequential VBA-HTTP execution
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Run-ConcurrencyBenchmark.ps1

  benchmark:vba-web:setup:
    desc: Acquire and verify the pinned VBA-Web comparator
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Setup-VBAWeb.ps1

  benchmark:vba-web:
    desc: Run the pinned VBA-Web loopback baseline
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Run-VBAWebBenchmark.ps1

  benchmark:phase0:
    desc: Refresh the Raw WinHttpRequest and VBA-Web Phase 0 baselines
    cmds:
      - task: benchmark:raw
      - task: benchmark:vba-web

  bootstrap:dirs:
    desc: Restore empty xlflow scaffold directories omitted by Git
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Ensure-XlflowDirectories.ps1

  build:plan:
    desc: Validate the production-only release build plan
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Validate-BuildPlan.ps1

  build:plan:xlam:
    desc: Validate the independent production-only XLAM build plan
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Validate-XlamBuildPlan.ps1

  release:checksum:
    desc: Generate an atomic checksum sidecar for the release artifact and manifest
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Write-ReleaseChecksums.ps1 -ArtifactPath build/Release/VBA-HTTP.xlsm

  release:build:
    desc: Build and validate the release workbook
    cmds:
      - task: bootstrap:dirs
      - task: build:plan
      - xlflow build --json --out build/Release/VBA-HTTP.xlsm
      - task: release:checksum
      - task: release:smoke

  release:xlam:build:
    desc: Build and validate the independent XLAM release artifact
    cmds:
      - task: bootstrap:dirs
      - task: build:plan:xlam
      - xlflow build --json --base build/VBA-HTTP.xlam --out build/Release/VBA-HTTP.xlam
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Write-ReleaseChecksums.ps1 -ArtifactPath build/Release/VBA-HTTP.xlam
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Validate-XlamArtifact.ps1 -ArtifactPath build/Release/VBA-HTTP.xlam

  release:smoke:
    desc: Inspect and execute the release workbook from an external harness
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Validate-ReleaseArtifact.ps1

  release:security:
    desc: Validate release manifest boundaries and write deterministic security evidence
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/Validate-ReleaseSecurity.ps1 -ReportPath .xlflow/release-security/release-security.json

  verify:
    desc: Run source, test, and release-plan verification
    cmds:
      - task: check
      - task: test
      - task: test:integration
      - task: testserver:test
      - task: test:release-checksum
      - task: test:release-security
      - task: test:security-risks
      - task: test:docs
      - task: test:xlam
      - task: test:clean-checkout
      - task: test:office-bitness
      - task: test:protocol-host-schema
      - task: build:plan

  hooks:install:
    desc: Install the repository Git hooks with Lefthook
    cmds:
      - lefthook install
